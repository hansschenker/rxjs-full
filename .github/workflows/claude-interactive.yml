name: Claude Interactive Assistant

# Responds to @claude mentions in issue and PR comments.
# Claude has full repo access and can read files, make commits, and open PRs.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only run when @claude is actually mentioned — avoids unnecessary API calls
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No prompt = interactive mode: Claude reads the comment and responds naturally.
          # Allowed tools give Claude broad repo management capabilities.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh label:*),mcp__github_inline_comment__create_inline_comment"
