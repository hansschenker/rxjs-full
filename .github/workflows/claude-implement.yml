name: Claude Implement Issue

# Triggered when an issue is labeled with claude:implement.
# Claude reads the issue, creates a branch, implements the code, and opens a PR.
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'claude:implement'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: 'true'
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY: ${{ github.event.issue.body }}

            Implement the feature or fix described in this issue.

            Steps:
            1. Read the existing codebase to understand conventions, structure, and patterns
            2. Create a branch: `git checkout -b claude/issue-${{ github.event.issue.number }}`
            3. Implement the changes — follow existing code style exactly
            4. Write or update tests if the project has a test suite
            5. Commit: `git add -A && git commit -m "fix/feat: <concise description> (closes #${{ github.event.issue.number }})"`
            6. Push: `git push origin claude/issue-${{ github.event.issue.number }}`
            7. Open a PR: `gh pr create --title "<title>" --body "Closes #${{ github.event.issue.number }}\n\n<description>" --repo ${{ github.repository }}`
            8. Comment on the issue with the PR link

            If the issue is ambiguous or requires decisions beyond what is described,
            post a comment on the issue asking for clarification instead of guessing.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
